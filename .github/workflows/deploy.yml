name: OneUni EMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build-web:
    name: Build & Validate Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Next.js Production Web Application
        run: |
          npm run build

  test-and-validate-api:
    name: Validate Python FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile apps/api/main.py

  build-docker:
    name: Build Docker Images & Verify Compose Stack
    runs-on: ubuntu-latest
    needs: [lint-and-build-web, test-and-validate-api]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker-compose build

      - name: Test Docker Compose Startup
        run: |
          docker-compose up -d
          sleep 10
          docker-compose ps
          docker-compose down

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/oneuni-ems || exit 1
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            docker system prune -f
